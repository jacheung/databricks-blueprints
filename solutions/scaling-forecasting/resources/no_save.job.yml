resources:
  jobs:
    no_save:
      name: "[${bundle.target}] scaling-forecasting: path 1 · no saved models"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: n_groups
          default: "10"
        - name: rows_per_group
          default: "50000"
        - name: skew
          default: "false"
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - prophet==1.5.0
              - scikit-learn
      tasks:
        - task_key: generate_data
          environment_key: default
          notebook_task:
            notebook_path: ../00_generate_timeseries_data.py
        - task_key: no_save_forecast
          depends_on:
            - task_key: generate_data
          environment_key: default
          notebook_task:
            notebook_path: ../01_no_save_forecast.py
