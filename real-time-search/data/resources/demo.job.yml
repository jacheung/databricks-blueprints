# Demo scenarios and personas for the app, synced to Lakebase. Run after clickstream_job (and again whenever it
# refreshes the simulated history: personas are picked from the user features' latest values).
resources:
  jobs:
    demo_job:
      name: rts-demo-scenarios
      parameters:
        - name: config_path
          default: ${workspace.file_path}/shared/configs/${bundle.target}.yml
      environments:
        - environment_key: serverless
          spec:
            client: "4"
      tasks:
        - task_key: demo_scenarios
          environment_key: serverless
          notebook_task:
            notebook_path: ../notebooks/demo_scenarios.py
        - task_key: demo_personas
          environment_key: serverless
          notebook_task:
            notebook_path: ../notebooks/demo_personas.py
