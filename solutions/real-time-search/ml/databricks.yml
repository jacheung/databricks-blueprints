# ML bundle: L1 retrieval, L2 rankers, evaluation, benchmarks. Jobs are added with their build steps.
# Deploy from this folder: databricks bundle deploy -t dev -p <profile>
bundle:
  name: rts-ml

include:
  - resources/*.yml

sync:
  paths:                             # sync root becomes real-time-search/, so files keep their repo layout
    - .
    - ../shared
  include:
    - ../shared/configs/*.yml        # gitignored per-target configs, uploaded anyway

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/real-time-search/ml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
