# The app reads Lakebase (QAC prefixes, demo scenarios) and produces scenario events to Kafka, as its service
# principal. After the first deploy, grant that principal SELECT on the synced tables and ACCESS on the Kafka
# service credential (README, "Run the app").
resources:
  apps:
    rts_app:
      name: rts-search
      description: "Real-time search demo: static vs session-aware QAC and SERP"
      source_code_path: ${workspace.file_path}
      config:
        command: ["uvicorn", "rts_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: PYTHONPATH
            value: shared/src:app/backend
          - name: RTS_CONFIG
            value: shared/configs/${bundle.target}.yml
      resources:
        - name: lakebase
          description: Shared Lakebase instance (online store, QAC prefixes, demo scenarios)
          postgres:
            branch: projects/rts-online-store/branches/production
            database: projects/rts-online-store/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
